<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>feliz cumple mi amor</title>
  <link href="https://fonts.googleapis.com/css2?family=Concert+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <!-- Librería externa para el confeti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>

  <audio id="miMusica" loop>
    <source src="cumplefeliz.mp3" type="audio/mpeg">
  </audio>

  <div class="container">
    <h1>hola mi amor, feliz cumple</h1>
    <p>tu regalo te lo voy a poder dar cuando vengas en noviembre, pero mientras te dejo un teaser.<br>te amo ♥ maria</p>

    <!-- Botón principal de revelación -->
    <button id="btnSorpresa" class="main-btn">ver sorpresa 👀</button>

    <!-- Contenedor con la imagen, posdata y control de audio (Oculto al inicio) -->
    <div id="revelado" class="hidden-content">
      <img src="LeBron.png" alt="un teaser de tu regalo" class="floating-image">

      <div class="ps-container">
        <p class="postscript">p.d. se me acaban las ideas, aiudaa</p>
      </div>

      <!-- Botón secundario para pausar/reproducir la música -->
      <button id="btnMusica" class="music-btn">pausa ⏸</button>
    </div>
  </div>

  <script>
    const musica = document.getElementById('miMusica');
    const btnSorpresa = document.getElementById('btnSorpresa');
    const btnMusica = document.getElementById('btnMusica');
    const revelado = document.getElementById('revelado');

    // Función para lanzar el confeti
    function lanzarConfeti() {
      confetti({
        particleCount: 100,
        spread: 70,
        origin: { y: 0.6 }
      });
    }

    // Acción del botón principal
  btnSorpresa.addEventListener('click', () => {
    // Si la sección aún está oculta, es el primer clic (Revelar)
    if (revelado.classList.contains('hidden-content')) {
      revelado.classList.remove('hidden-content');
      btnSorpresa.textContent = 'otra vez 🎉';
      btnSorpresa.classList.add('small-btn');
    

      // Inicia la música solo en esta primera interacción
      if (musica.paused) {
        musica.play();
        btnMusica.textContent = 'pausa ⏸';
        btnMusica.classList.add('playing');
      }
    }

    // El confeti se dispara CADA VEZ que se presione el botón
    lanzarConfeti();
  });

  // Control manual independiente para reproducir o pausar la música
  btnMusica.addEventListener('click', () => {
    if (musica.paused) {
      musica.play();
      btnMusica.textContent = 'pausa ⏸';
      btnMusica.classList.add('playing');
    } else {
      musica.pause();
      btnMusica.textContent = 'play ▶';
      btnMusica.classList.remove('playing');
    }
  });
</script>

</body>
</html>
